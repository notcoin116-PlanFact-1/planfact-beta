name: Deploy frozen exact PlanFact Site v28
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore frozen verified Site v28 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site artifact.zip
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9184915103/zip > artifact.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib

          root=Path('site')
          root.mkdir()
          with ZipFile('artifact.zip') as z:
              for name in z.namelist():
                  if not name.startswith('recovered-site/') or name.endswith('/'):
                      continue
                  rel=name[len('recovered-site/'):]
                  if not rel or '\\' in rel:
                      continue
                  p=root/rel
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(z.read(name))

          expected={
            'favicon.svg':'e6d2e59b7b5bbb0342e0fb496dfc262decbfe4426bbb7b047aec8d467d1dc6f7',
            'assets/index-CyPh85IR.js':'6d3b58d05778dd9e32d6adaf19b75c46ec60a5aa07eeaf88da61b861a6075385',
            'assets/page-W1M-VqDA.js':'e9a0b56499567d324b4861b7ffe8e1305c9960f78128ae3a12b3a1af7cfcd473',
            'assets/index-Da-M0CQm.css':'1f7f8d840b01ddad29b9641dd585ceb96d8eb674c53a92746ce504f01e12c5d2',
            'assets/framework-CXnKph_e.js':'73b45b606448e4dc310fbe851d8089ee752f3eb081980b3a6fec88988820ee12'
          }
          for rel,want in expected.items():
              p=root/rel
              if not p.is_file(): raise SystemExit('Missing exact Site v28 asset: '+rel)
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got!=want: raise SystemExit('Checksum mismatch for '+rel)

          app=(root/'assets/page-W1M-VqDA.js').read_text(encoding='utf-8')
          markers=['Стартовый цикл','Последний вывод','Настройки один раз','Мои биржи','Защищённые данные','Доступ тестировщиков','Добавить новую сделку','Скриншот, голос или ручной ввод','Торговые параметры']
          missing=[m for m in markers if m not in app]
          if missing: raise SystemExit('Original Sol UI markers missing: '+', '.join(missing))

          # Only adapt root asset URLs to GitHub project-pages location.
          # CSS, JS, SVG icons, fonts, DOM, copy and layout remain untouched.
          idx=root/'index.html'
          s=idx.read_text(encoding='utf-8')
          s=s.replace('"/assets/','"./assets/').replace("'/assets/","'./assets/")
          s=s.replace('href="/favicon.svg"','href="./favicon.svg"')
          idx.write_text(s,encoding='utf-8')
          print('Verified exact Sol interface files:',sum(1 for p in root.rglob('*') if p.is_file()))
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
