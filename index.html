<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f0d"><title>PlanFact Beta</title><script src="https://telegram.org/js/telegram-web-app.js?63"></script><style>:root{--bg:#090d0b;--card:#101713;--line:#243128;--text:#f3f7f4;--muted:#91a097;--green:#54e58c;--red:#ff7373}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding:18px 16px 90px}.top,.between,.row{display:flex;align-items:center}.top,.between{justify-content:space-between;gap:10px}.row{gap:8px;flex-wrap:wrap}.brand{display:flex;gap:10px;align-items:center}.logo,.pf{display:grid;place-items:center;background:var(--green);color:#07130b;font-weight:900}.logo{width:38px;height:38px;border-radius:12px}.pf{width:64px;height:64px;border-radius:20px;font-size:28px;margin:0 auto 14px}.sub,.muted{color:var(--muted)}h1{font-size:26px;margin:4px 0 14px}h2{font-size:18px;margin:0 0 10px}.badge,.pill{border-radius:999px;font-weight:700}.badge{border:1px solid #345440;background:#132319;padding:7px 10px;color:var(--green);font-size:12px}.pill{padding:5px 8px;background:#18251c;color:#b9c5bd;font-size:11px}.card,.trade,.user{background:#101713;border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:13px;border-radius:15px;background:#0c120e;border:1px solid #202c24}.stat b{display:block;font-size:20px}.btn{width:100%;border:0;border-radius:14px;padding:13px 14px;font-weight:800;background:var(--green);color:#06130a;margin:5px 0}.btn.secondary{background:#18221c;color:var(--text);border:1px solid #2a392f}.btn.danger{background:#2b1717;color:#ffaaaa;border:1px solid #54302f}.btn.small{width:auto;padding:8px 10px;border-radius:10px;font-size:12px}input,select,textarea{width:100%;background:#0b100d;border:1px solid #2a362e;color:var(--text);border-radius:12px;padding:11px 12px}.fields{display:grid;gap:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(9,13,11,.96);border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.tabbar{width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.tab{border:0;background:transparent;color:#819087;padding:8px 3px;border-radius:10px;font-size:11px}.tab.active{background:#16231b;color:var(--green)}.gate{min-height:88vh;display:grid;place-items:center}.gate .card{max-width:440px;text-align:center;padding:28px}.green{color:var(--green)}.red{color:var(--red)}.empty{text-align:center;padding:28px;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#101713;border:1px solid #2b3a30;border-radius:22px 22px 0 0;width:min(760px,100%);max-height:90vh;overflow:auto;padding:18px 16px 24px}.close{float:right;background:none;border:0;color:#aaa;font-size:25px}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><div id="root"></div><script>const API='https://vjglqivddspcolrzxmxt.supabase.co/functions/v1/planfact-beta-gateway',CHANNEL='https://t.me/+73iOw1s79jVmOTgy',BOT='https://t.me/PlanFactTrader_bot';const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();let init=tg?.initData?.trim()||'',state=null,current='home';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function call(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,init_data:init,...data})});const b=await r.json().catch(()=>({}));if(!r.ok||b.ok!==true){const e=new Error(b.error||'server_unavailable');e.code=b.error||'server_unavailable';throw e}return b}function tier(a){return a?.tier==='owner_pro'?'Owner Pro':a?.tier==='beta_pro'?'Beta Pro':'Base'}function gate(k){const title=k==='sub'?'Подпишись, чтобы открыть журнал':k==='open'?'Открой PlanFact в Telegram':'Не удалось проверить доступ';document.getElementById('root').innerHTML='<main class="app gate"><section class="card"><div class="pf">PF</div><div class="muted">PlanFact Trader</div><h1>'+title+'</h1><p class="muted">'+(k==='sub'?'PlanFact Beta доступен участникам закрытого канала. Подпишись, вернись сюда и нажми «Проверить подписку».':k==='open'?'Запусти Mini App через @PlanFactTrader_bot.':'Повтори проверку через несколько секунд.')+'</p>'+(k==='sub'?'<button class="btn" onclick="openLink(CHANNEL)">Открыть канал</button><button class="btn secondary" onclick="boot()">Проверить подписку</button>':k==='open'?'<button class="btn" onclick="openLink(BOT)">Открыть @PlanFactTrader_bot</button>':'<button class="btn" onclick="boot()">Проверить ещё раз</button>')+'</section></main>'}function openLink(u){tg?.openTelegramLink?tg.openTelegramLink(u):location.href=u}function pnl(t){const n=Number(String(t.netPnlUsdt??t.pnlUsdt??'').replace(',','.'));return Number.isFinite(n)?n:0}function closed(t){return t.status==='closed'||!!t.closedAt||!!t.exit}function render(){const a=state.access;document.getElementById('root').innerHTML='<main class="app"><header class="top"><div class="brand"><div class="logo">PF</div><div><b>PlanFact</b><div class="sub">торговая дисциплина</div></div></div><span class="badge">'+tier(a)+'</span></header><section id="view"></section></main><nav class="tabs"><div class="tabbar">'+[['home','Главная'],['trades','Сделки'],['plans','План'],['patterns','Ошибки'],['profile','Профиль']].map(x=>'<button class="tab '+(current===x[0]?'active':'')+'" onclick="nav(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div></nav>';({home,trades,plans,patterns,profile}[current]||home)()}function nav(v){current=v;render()}function home(){const tr=state.trades||[],c=tr.filter(closed),sum=c.reduce((a,t)=>a+pnl(t),0);$('#view').innerHTML='<p class="muted">Сегодня</p><h1>Привет, '+esc(state.user?.greetingName||'Трейдер')+'</h1><div class="grid"><div class="stat"><span class="muted">Сделки</span><b>'+c.length+'</b></div><div class="stat"><span class="muted">P&L</span><b class="'+(sum>=0?'green':'red')+'">'+sum.toFixed(2)+'</b></div><div class="stat"><span class="muted">Открыто</span><b>'+tr.filter(t=>!closed(t)).length+'</b></div><div class="stat"><span class="muted">Планов</span><b>'+((state.plans||[]).filter(p=>p.status==='locked').length)+'</b></div></div><button class="btn" onclick="tradeModal()">+ Добавить сделку</button>'+(state.access.isPro?'<button class="btn secondary" onclick="nav(\'plans\')">Plan vs Fact</button>':'<div class="card"><b>Plan vs Fact доступен в Beta Pro</b><p class="muted">Beta Pro выдаётся владельцем вручную.</p></div>')}function trades(){const tr=state.trades||[];$('#view').innerHTML='<div class="between"><h1>Сделки</h1><button class="btn small" onclick="tradeModal()">+ Сделка</button></div>'+(tr.length?tr.map(t=>'<article class="trade"><div class="between"><b>'+esc(t.pair)+' · '+esc(t.direction)+'</b><span class="'+(pnl(t)>=0?'green':'red')+'">'+(closed(t)?pnl(t).toFixed(2)+' USDT':'OPEN')+'</span></div><div class="muted">'+esc(t.tradeDate||'')+' · '+esc(t.source||'manual')+'</div><button class="btn small danger" onclick="removeTrade(\''+esc(t.id)+'\')">Удалить</button></article>').join(''):'<div class="empty">Сделок пока нет.</div>')}function plans(){if(!state.access.isPro){$('#view').innerHTML='<h1>План</h1><div class="card"><b>Plan vs Fact доступен в Beta Pro</b><p class="muted">План фиксируется до входа, факт сравнивается после сделки.</p></div>';return}const p=state.plans||[];$('#view').innerHTML='<div class="between"><h1>Plan vs Fact</h1><button class="btn small" onclick="planModal()">+ План</button></div>'+(p.length?p.map(x=>'<article class="trade"><b>'+esc(x.pair)+' · '+esc(x.direction)+'</b><div class="muted">Entry '+esc(x.original?.plannedEntry)+' · Stop '+esc(x.original?.stop)+'</div></article>').join(''):'<div class="empty">Планов пока нет.</div>')}function patterns(){const tr=(state.trades||[]).filter(closed),d=tr.filter(t=>t.followedPlan||t.emotion||t.impulse);$('#view').innerHTML='<h1>Ошибки</h1><div class="grid"><div class="stat"><span class="muted">С данными</span><b>'+d.length+'</b></div><div class="stat"><span class="muted">Нарушен план</span><b>'+d.filter(t=>t.followedPlan==='Нет'||t.followedPlan==='Частично').length+'</b></div></div><div class="card"><b>AI-анализ</b><p class="muted">Включим после финального smoke-test Beta API.</p></div>'}function profile(){const a=state.access,p=state.profile||{};$('#view').innerHTML='<h1>Профиль</h1><div class="card"><b>'+tier(a)+'</b><div class="muted">Account Code: '+esc(state.user?.accountCode)+'</div></div><div class="card"><h2>Торговые параметры</h2><div class="fields"><input id="pex" value="'+esc(p.exchange||'BingX')+'"><input id="pmarket" value="'+esc(p.market||'Фьючерсы')+'"><input id="pstyle" placeholder="Стиль" value="'+esc(p.style||'')+'"><button class="btn" onclick="saveProfile()">Сохранить</button></div></div><div class="card"><h2>BingX</h2><p class="muted">'+(a.isPro?'Read-only синхронизация будет включена после финального smoke-test.':'Доступно в Beta Pro.')+'</p></div>'+(a.isOwner?'<div class="card"><h2>Owner Beta</h2><button class="btn secondary" onclick="loadAdmin()">Управление тестерами</button><div id="admin"></div></div>':'')+'<button class="btn danger" onclick="deleteAccount()">Удалить мои данные</button>'}function modal(title,body){document.body.insertAdjacentHTML('beforeend','<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2>'+title+'</h2>'+body+'</div></div>')}function closeModal(){$('#modal')?.remove()}function tradeModal(){modal('Новая сделка','<div class="fields"><input id="tpair" placeholder="BTC/USDT"><select id="tdir"><option>Long</option><option>Short</option></select><div class="two"><input id="tentry" placeholder="Вход"><input id="texit" placeholder="Выход"></div><input id="tpnl" placeholder="P&L USDT"><button class="btn" onclick="saveTrade()">Сохранить</button></div>')}async function saveTrade(){const trade={id:crypto.randomUUID(),createdAt:new Date().toISOString(),tradeDate:new Date().toISOString(),source:'manual',exchange:'BingX',market:'Фьючерсы',pair:$('#tpair').value.trim(),direction:$('#tdir').value,entry:$('#tentry').value.trim(),exit:$('#texit').value.trim(),volume:'',pnlUsdt:$('#tpnl').value.trim(),status:$('#texit').value.trim()?'closed':'open'};try{state=await call('save_trade',{trade});closeModal();render()}catch(e){alert(e.code)}}async function removeTrade(id){if(!confirm('Удалить сделку?'))return;state=await call('delete_trade',{trade_id:id});render()}function planModal(){modal('Новый план','<div class="fields"><input id="plpair" placeholder="BTC/USDT"><select id="pldir"><option>Long</option><option>Short</option></select><input id="plentry" placeholder="Плановый вход"><input id="plstop" placeholder="Стоп"><input id="plsize" placeholder="Размер позиции"><button class="btn" onclick="savePlan()">Зафиксировать</button></div>')}async function savePlan(){const plan={exchange:'BingX',market:'Фьючерсы',pair:$('#plpair').value.trim(),direction:$('#pldir').value,plannedEntry:$('#plentry').value.trim(),stop:$('#plstop').value.trim(),target:'',positionSize:$('#plsize').value.trim(),deposit:'',riskUnit:'percent',strategy:'',note:''};try{state=await call('lock_trade_plan',{plan});closeModal();render()}catch(e){alert(e.code)}}async function saveProfile(){try{state=await call('save_profile',{profile:{exchange:$('#pex').value,market:$('#pmarket').value,style:$('#pstyle').value}});render()}catch(e){alert(e.code)}}async function loadAdmin(){try{const d=(await call('beta_admin_dashboard')).dashboard;$('#admin').innerHTML=d.users.length?d.users.map(u=>'<div class="user"><b>'+esc(u.accountCode)+'</b> · '+esc(u.tier)+'<div class="row"><button class="btn small" onclick="setBeta(\''+u.accountCode+'\',30)">+30</button><button class="btn small" onclick="setBeta(\''+u.accountCode+'\',90)">+90</button></div></div>').join(''):'<div class="empty">Пользователей пока нет.</div>'}catch(e){alert(e.code)}}async function setBeta(code,days){await call('set_beta_access',{target_account_code:code,enabled:true,duration_days:days,permanent:false});loadAdmin()}async function deleteAccount(){if(!confirm('Удалить все данные PlanFact?'))return;await call('delete_account_data');location.reload()}async function boot(){if(!init){gate('open');return}document.getElementById('root').innerHTML='<main class="app gate"><section class="card"><div class="pf">PF</div><h1>Проверяем доступ</h1><p class="green">Проверяем…</p></section></main>';try{state=await call('account');render()}catch(e){if(e.code==='channel_subscription_required')gate('sub');else if(['telegram_auth_required','telegram_signature_invalid','telegram_session_expired'].includes(e.code))gate('open');else gate('fail')}}boot();</script></body></html>
