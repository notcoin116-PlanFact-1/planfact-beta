<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c110e">
<title>PlanFact Beta</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
:root{--bg:#090d0b;--card:#101713;--line:#243128;--text:#f3f7f4;--muted:#91a097;--green:#70f59f;--green2:#183323;--red:#ff7b7b;--amber:#f5c960;--input:#0b100d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding:18px 16px 96px}.top,.between,.row{display:flex;align-items:center}.top,.between{justify-content:space-between;gap:10px}.row{gap:8px;flex-wrap:wrap}.brand{display:flex;gap:10px;align-items:center}.logo,.pf{display:grid;place-items:center;background:var(--green);color:#06130a;font-weight:900}.logo{width:38px;height:38px;border-radius:12px}.pf{width:68px;height:68px;border-radius:21px;font-size:28px;margin:0 auto 14px}.sub,.muted{color:var(--muted)}h1{font-size:27px;margin:8px 0 14px}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:8px 0}.badge,.pill{border-radius:999px;font-weight:800}.badge{border:1px solid #345440;background:#132319;padding:7px 10px;color:var(--green);font-size:12px}.pill{padding:5px 8px;background:#18251c;color:#b9c5bd;font-size:11px}.card,.trade,.user{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:13px;border-radius:15px;background:#0c120e;border:1px solid #202c24}.stat b{display:block;font-size:20px}.btn{width:100%;border:0;border-radius:14px;padding:13px 14px;font-weight:850;background:var(--green);color:#06130a;margin:5px 0;cursor:pointer}.btn.secondary{background:#18221c;color:var(--text);border:1px solid #2a392f}.btn.danger{background:#2b1717;color:#ffb0b0;border:1px solid #54302f}.btn.amber{background:#302714;color:#f6d788;border:1px solid #594722}.btn.small{width:auto;padding:8px 10px;border-radius:10px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;background:var(--input);border:1px solid #2a362e;color:var(--text);border-radius:12px;padding:11px 12px;font:inherit}textarea{min-height:96px;resize:vertical}.fields{display:grid;gap:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(9,13,11,.97);border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:10}.tabbar{width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.tab{border:0;background:transparent;color:#819087;padding:8px 3px;border-radius:10px;font-size:11px}.tab.active{background:#16231b;color:var(--green)}.gate{min-height:88vh;display:grid;place-items:center}.gate .card{max-width:440px;text-align:center;padding:28px}.green{color:var(--green)}.red{color:var(--red)}.ambertext{color:var(--amber)}.empty{text-align:center;padding:28px;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#101713;border:1px solid #2b3a30;border-radius:22px 22px 0 0;width:min(760px,100%);max-height:92vh;overflow:auto;padding:18px 16px 28px}.close{float:right;background:none;border:0;color:#aaa;font-size:27px}.notice{padding:10px 12px;border-radius:12px;background:#111f16;border:1px solid #264332;color:#bfe9cd}.warn{padding:10px 12px;border-radius:12px;background:#271f10;border:1px solid #4c3d20;color:#f2d58b}.errorbox{padding:10px 12px;border-radius:12px;background:#2a1515;border:1px solid #543030;color:#ffb0b0}.ai-pattern{padding:12px;border-radius:14px;background:#0c120e;border:1px solid #27352c;margin:8px 0}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}.divider{height:1px;background:var(--line);margin:14px 0}.tiny{font-size:12px}.statusdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}.statusdot.off{background:var(--red)}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}.filters{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body><div id="root"></div>
<script>
const API='https://vjglqivddspcolrzxmxt.supabase.co/functions/v1/planfact-beta-gateway';
const CHANNEL='https://t.me/+73iOw1s79jVmOTgy';
const BOT='https://t.me/PlanFactTrader_bot';
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
let init=tg?.initData?.trim()||'',state=null,current='home',aiResult=null,busy=false;
let dealFilters={period:'all',direction:'all',status:'all',source:'all',plan:'all',result:'all',symbol:'',strategy:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const codeMessage={channel_subscription_required:'Нужна подписка на канал.',telegram_membership_check_failed:'Telegram временно не подтвердил подписку. Повтори проверку.',beta_pro_access_required:'Функция доступна в Beta Pro.',bingx_credentials_invalid:'Проверь API Key и Secret Key BingX.',bingx_ip_restricted:'BingX ограничил ключ по IP.',bingx_temporarily_unavailable:'BingX временно недоступен.',ai_daily_limit_reached:'Дневной AI-лимит исчерпан.',ai_too_many_requests:'Слишком много AI-запросов подряд.',not_enough_trades_for_analysis:'Для анализа нужно минимум 5 сделок с заполненной дисциплиной.',screenshot_format_invalid:'Поддерживаются JPG, PNG и WEBP.',screenshot_too_large:'Скриншот слишком большой.',server_unavailable:'Сервис временно недоступен.'};
function msg(e){return codeMessage[e?.code]||e?.code||'Неизвестная ошибка'}
async function call(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,init_data:init,...data})});const b=await r.json().catch(()=>({}));if(!r.ok||b.ok!==true){const e=new Error(b.error||'server_unavailable');e.code=b.error||'server_unavailable';throw e}return b}
async function callFile(action,file){const f=new FormData();f.append('action',action);f.append('init_data',init);f.append('screenshot',file);const r=await fetch(API,{method:'POST',body:f});const b=await r.json().catch(()=>({}));if(!r.ok||b.ok!==true){const e=new Error(b.error||'server_unavailable');e.code=b.error||'server_unavailable';throw e}return b}
function tier(a){return a?.tier==='owner_pro'?'Owner Pro':a?.tier==='beta_pro'?'Beta Pro':'Base'}
function openLink(u){tg?.openTelegramLink?tg.openTelegramLink(u):location.href=u}
function gate(k){const title=k==='sub'?'Подпишись, чтобы открыть журнал':k==='open'?'Открой PlanFact в Telegram':'Не удалось проверить доступ';document.getElementById('root').innerHTML='<main class="app gate"><section class="card"><div class="pf">PF</div><div class="muted">PlanFact Trader</div><h1>'+title+'</h1><p class="muted">'+(k==='sub'?'PlanFact Beta доступен участникам закрытого канала. Подпишись, вернись сюда и нажми «Проверить подписку».':k==='open'?'Запусти Mini App через @PlanFactTrader_bot.':'Сервер не получил подтверждение. Повтори проверку через несколько секунд.')+'</p>'+(k==='sub'?'<button class="btn" onclick="openLink(CHANNEL)">Открыть канал</button><button class="btn secondary" onclick="boot()">Проверить подписку</button>':k==='open'?'<button class="btn" onclick="openLink(BOT)">Открыть @PlanFactTrader_bot</button>':'<button class="btn" onclick="boot()">Проверить ещё раз</button>')+'</section></main>'}
function pnl(t){const n=Number(String(t.netPnlUsdt??t.pnlUsdt??'').replace(',','.'));return Number.isFinite(n)?n:0}
function closed(t){return t.status==='closed'||!!t.closedAt||!!t.exit}
function render(){const a=state.access;document.getElementById('root').innerHTML='<main class="app"><header class="top"><div class="brand"><div class="logo">PF</div><div><b>PlanFact</b><div class="sub">торговая дисциплина</div></div></div><span class="badge">'+tier(a)+'</span></header><section id="view"></section></main><nav class="tabs"><div class="tabbar">'+[['home','Главная'],['trades','Сделки'],['plans','План'],['patterns','Ошибки'],['profile','Профиль']].map(x=>'<button class="tab '+(current===x[0]?'active':'')+'" onclick="nav(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div></nav>';({home,trades,plans,patterns,profile}[current]||home)()}
function nav(v){current=v;render()}
function home(){const tr=state.trades||[],c=tr.filter(closed),sum=c.reduce((a,t)=>a+pnl(t),0);$('#view').innerHTML='<p class="muted">Сегодня</p><h1>Привет, '+esc(state.user?.greetingName||'Трейдер')+'</h1><div class="grid"><div class="stat"><span class="muted">Закрыто</span><b>'+c.length+'</b></div><div class="stat"><span class="muted">P&L</span><b class="'+(sum>=0?'green':'red')+'">'+sum.toFixed(2)+'</b></div><div class="stat"><span class="muted">Открыто</span><b>'+tr.filter(t=>!closed(t)).length+'</b></div><div class="stat"><span class="muted">Планов</span><b>'+((state.plans||[]).filter(p=>p.status==='locked').length)+'</b></div></div><button class="btn" onclick="tradeModal()">+ Добавить сделку</button><label class="btn secondary file">Скриншот → AI<input type="file" accept="image/jpeg,image/png,image/webp" onchange="screenAI(this.files[0])"></label>'+(state.access.isPro?'<button class="btn secondary" onclick="nav(\'plans\')">Plan vs Fact</button>':'<div class="card"><b>Plan vs Fact доступен в Beta Pro</b><p class="muted">Beta Pro выдаётся владельцем вручную. Base сохраняет ручной журнал и использует ограниченный AI.</p></div>')}
function filteredTrades(){const now=Date.now(),tr=state.trades||[],linked=new Set((state.plans||[]).map(p=>p.factTradeId).filter(Boolean));return tr.filter(t=>{const d=Date.parse(t.tradeDate||t.createdAt||'');if(dealFilters.period==='7'&&(!Number.isFinite(d)||now-d>7*864e5))return false;if(dealFilters.period==='30'&&(!Number.isFinite(d)||now-d>30*864e5))return false;if(dealFilters.direction!=='all'&&t.direction!==dealFilters.direction)return false;const st=closed(t)?'closed':'open';if(dealFilters.status!=='all'&&st!==dealFilters.status)return false;if(dealFilters.source!=='all'&&String(t.source||'manual')!==dealFilters.source)return false;if(dealFilters.plan==='with'&&!linked.has(t.id))return false;if(dealFilters.plan==='without'&&linked.has(t.id))return false;if(dealFilters.result==='profit'&&pnl(t)<=0)return false;if(dealFilters.result==='loss'&&pnl(t)>=0)return false;if(dealFilters.symbol&&!String(t.pair||'').toLowerCase().includes(dealFilters.symbol.toLowerCase()))return false;if(dealFilters.strategy&&!String(t.strategy||'').toLowerCase().includes(dealFilters.strategy.toLowerCase()))return false;return true})}
function trades(){const tr=filteredTrades();$('#view').innerHTML='<div class="between"><h1>Сделки</h1><button class="btn small" onclick="tradeModal()">+ Сделка</button></div><div class="filters"><select onchange="dealFilters.period=this.value;trades()"><option value="all" '+(dealFilters.period==='all'?'selected':'')+'>Весь период</option><option value="7" '+(dealFilters.period==='7'?'selected':'')+'>7 дней</option><option value="30" '+(dealFilters.period==='30'?'selected':'')+'>30 дней</option></select><select onchange="dealFilters.direction=this.value;trades()"><option value="all">Long + Short</option><option value="Long" '+(dealFilters.direction==='Long'?'selected':'')+'>Long</option><option value="Short" '+(dealFilters.direction==='Short'?'selected':'')+'>Short</option></select><select onchange="dealFilters.status=this.value;trades()"><option value="all">Open + Closed</option><option value="open" '+(dealFilters.status==='open'?'selected':'')+'>Open</option><option value="closed" '+(dealFilters.status==='closed'?'selected':'')+'>Closed</option></select><select onchange="dealFilters.source=this.value;trades()"><option value="all">Все источники</option><option value="manual" '+(dealFilters.source==='manual'?'selected':'')+'>Manual</option><option value="bingx" '+(dealFilters.source==='bingx'?'selected':'')+'>BingX</option><option value="screenshot" '+(dealFilters.source==='screenshot'?'selected':'')+'>Screenshot</option></select><select onchange="dealFilters.plan=this.value;trades()"><option value="all">С планом + без</option><option value="with" '+(dealFilters.plan==='with'?'selected':'')+'>С планом</option><option value="without" '+(dealFilters.plan==='without'?'selected':'')+'>Без плана</option></select><select onchange="dealFilters.result=this.value;trades()"><option value="all">Любой результат</option><option value="profit" '+(dealFilters.result==='profit'?'selected':'')+'>Прибыльные</option><option value="loss" '+(dealFilters.result==='loss'?'selected':'')+'>Убыточные</option></select><input placeholder="Пара" value="'+esc(dealFilters.symbol)+'" oninput="dealFilters.symbol=this.value;trades()"><input placeholder="Стратегия" value="'+esc(dealFilters.strategy)+'" oninput="dealFilters.strategy=this.value;trades()"></div><div class="muted tiny">Найдено: '+tr.length+'</div>'+(tr.length?tr.map(t=>'<article class="trade"><div class="between"><b>'+esc(t.pair)+' · '+esc(t.direction)+'</b><span class="'+(pnl(t)>=0?'green':'red')+'">'+(closed(t)?pnl(t).toFixed(2)+' USDT':'OPEN')+'</span></div><div class="muted">'+esc(t.tradeDate||'')+' · '+esc(t.source||'manual')+'</div>'+(t.strategy?'<div class="tiny">'+esc(t.strategy)+'</div>':'')+'<button class="btn small danger" onclick="removeTrade(\''+esc(t.id)+'\')">Удалить</button></article>').join(''):'<div class="empty">По фильтрам сделок нет.</div>')}
function plans(){if(!state.access.isPro){$('#view').innerHTML='<h1>План</h1><div class="card"><b>Plan vs Fact доступен в Beta Pro</b><p class="muted">План фиксируется до входа, факт сравнивается после сделки.</p><button class="btn secondary" onclick="openLink(BOT+'?start=support')">Запросить Beta Pro</button></div>';return}const p=state.plans||[];$('#view').innerHTML='<div class="between"><h1>Plan vs Fact</h1><button class="btn small" onclick="planModal()">+ План</button></div>'+(p.length?p.map(x=>'<article class="trade"><div class="between"><b>'+esc(x.pair)+' · '+esc(x.direction)+'</b><span class="pill">'+esc(x.status)+'</span></div><div class="muted">Entry '+esc(x.original?.plannedEntry)+' · Stop '+esc(x.original?.stop)+' · Size '+esc(x.original?.positionSize)+'</div>'+(x.comparison?comparisonHtml(x.comparison):'')+(x.status==='locked'?'<button class="btn small danger" onclick="cancelPlan(\''+x.planId+'\')">Отменить</button>':'')+'</article>').join(''):'<div class="empty">Планов пока нет.</div>')}
function comparisonHtml(c){return '<div class="divider"></div><b>Fact: '+esc(c.status)+'</b>'+(c.actualRiskPercent!=null?'<div class="muted">Фактический риск: '+esc(c.actualRiskPercent)+'%</div>':'')+(c.warnings||[]).map(w=>'<div class="warn tiny">'+esc(w)+'</div>').join('')}
function patterns(){const tr=(state.trades||[]).filter(closed),d=tr.filter(t=>t.followedPlan||t.emotion||t.impulse);$('#view').innerHTML='<h1>Ошибки</h1><div class="grid"><div class="stat"><span class="muted">С данными</span><b>'+d.length+'</b></div><div class="stat"><span class="muted">Нарушен план</span><b>'+d.filter(t=>t.followedPlan==='Нет'||t.followedPlan==='Частично').length+'</b></div></div>'+(state.access.isPro?'<div class="card"><h2>AI-анализ дисциплины</h2><p class="muted">AI получает только обезличенные поля дисциплины, без Telegram ID, Account Code и биржевых идентификаторов.</p><button class="btn" onclick="disciplineAI()">Проанализировать</button><div id="aiout">'+aiHtml()+'</div></div>':'<div class="card"><b>Расширенный AI доступен в Beta Pro</b><p class="muted">В Base остаётся AI-разбор скриншота сделки.</p></div>')}
function aiHtml(){if(!aiResult)return'';return '<div class="notice"><b>'+esc(aiResult.summary||'Анализ готов')+'</b></div>'+((aiResult.patterns||[]).map(p=>'<div class="ai-pattern"><b>'+esc(p.title)+'</b><p>'+esc(p.evidence)+'</p><div class="green">'+esc(p.practicalAction)+'</div></div>').join(''))+(aiResult.nextStep?'<div class="card"><b>Следующий шаг</b><p>'+esc(aiResult.nextStep)+'</p></div>':'')}
function profile(){const a=state.access,p=state.profile||{},cx=(state.exchangeConnections||[]).find(x=>x.exchange==='bingx');let bx='';if(!a.isPro)bx='<p class="muted">Read-only синхронизация BingX доступна в Beta Pro.</p>';else if(cx)bx='<p><span class="statusdot '+(cx.status==='connected'?'':'off')+'"></span><b>'+esc(cx.status)+'</b></p><div class="muted">API: '+esc(cx.apiKeyMask||'скрыт')+(cx.externalUserIdMasked?' · UID '+esc(cx.externalUserIdMasked):'')+'</div><div class="muted tiny">Последняя синхронизация: '+esc(cx.lastSyncAt||'ещё не было')+'</div><button class="btn" onclick="syncBingx()">Синхронизировать</button><button class="btn secondary" onclick="verifyBingx()">Проверить подключение</button><button class="btn danger" onclick="disconnectBingx()">Отключить BingX</button>';else bx='<p class="muted">Только чтение. Разрешения на торговлю и вывод средств не используются.</p><div class="fields"><input id="bxkey" autocomplete="off" placeholder="BingX API Key"><input id="bxsecret" autocomplete="off" type="password" placeholder="BingX Secret Key"><button class="btn" onclick="connectBingx()">Подключить BingX</button></div>';$('#view').innerHTML='<h1>Профиль</h1><div class="card"><b>'+tier(a)+'</b><div class="muted">Account Code: '+esc(state.user?.accountCode)+'</div></div><div class="card"><h2>Торговые параметры</h2><div class="fields"><input id="pex" value="'+esc(p.exchange||'BingX')+'"><input id="pmarket" value="'+esc(p.market||'Фьючерсы')+'"><input id="pstyle" placeholder="Стиль" value="'+esc(p.style||'')+'"><input id="pdep" inputmode="decimal" placeholder="Депозит" value="'+esc(p.deposit||'')+'"><button class="btn" onclick="saveProfile()">Сохранить</button></div></div><div class="card"><h2>BingX</h2>'+bx+'</div><div class="card"><h2>Поддержка Beta</h2><p class="muted">Не отправляй API/Secret Key в сообщениях.</p><button class="btn secondary" onclick="supportModal()">Сообщить о проблеме</button><button class="btn secondary" onclick="openLink(BOT+'?start=support')">Открыть @PlanFactTrader_bot</button></div>'+(a.isOwner?'<div class="card"><h2>Owner Beta</h2><button class="btn secondary" onclick="loadAdmin()">Управление тестерами</button><div id="admin"></div></div>':'')+'<button class="btn danger" onclick="deleteAccount()">Удалить мои данные</button>'}
function modal(title,body){document.body.insertAdjacentHTML('beforeend','<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2>'+title+'</h2>'+body+'</div></div>')}
function closeModal(){$('#modal')?.remove()}
function tradeModal(pref={}){modal('Новая сделка','<div class="fields"><input id="tpair" placeholder="BTC/USDT" value="'+esc(pref.pair||'')+'"><select id="tdir"><option '+(pref.direction==='Long'?'selected':'')+'>Long</option><option '+(pref.direction==='Short'?'selected':'')+'>Short</option></select><div class="two"><input id="tentry" placeholder="Вход" value="'+esc(pref.entry||'')+'"><input id="texit" placeholder="Выход" value="'+esc(pref.exit||'')+'"></div><input id="tvol" placeholder="Объём" value="'+esc(pref.volume||'')+'"><input id="tpnl" placeholder="P&L USDT" value="'+esc(pref.pnlUsdt||'')+'"><input id="tstrategy" placeholder="Стратегия"><select id="tfollow"><option value="">Соблюдение плана</option><option>Да</option><option>Частично</option><option>Нет</option></select><input id="temotion" placeholder="Эмоция"><input id="timpulse" placeholder="Импульс / причина"><button class="btn" onclick="saveTrade(\''+(pref.source||'manual')+'\')">Проверил данные, сохранить</button></div>')}
async function saveTrade(source='manual'){const trade={id:crypto.randomUUID(),createdAt:new Date().toISOString(),tradeDate:new Date().toISOString(),source,exchange:'BingX',market:'Фьючерсы',pair:$('#tpair').value.trim(),direction:$('#tdir').value,entry:$('#tentry').value.trim(),exit:$('#texit').value.trim(),volume:$('#tvol').value.trim(),pnlUsdt:$('#tpnl').value.trim(),strategy:$('#tstrategy').value.trim(),followedPlan:$('#tfollow').value,emotion:$('#temotion').value.trim(),impulse:$('#timpulse').value.trim(),status:$('#texit').value.trim()?'closed':'open'};try{state=await call('save_trade',{trade});closeModal();render()}catch(e){alert(msg(e))}}
async function removeTrade(id){if(!confirm('Удалить сделку?'))return;try{state=await call('delete_trade',{trade_id:id});render()}catch(e){alert(msg(e))}}
async function screenAI(file){if(!file)return;modal('AI читает скриншот','<div class="notice">Изображение не сохраняется в журнал автоматически. Сначала ты проверишь распознанные поля.</div><p class="green">Анализируем…</p>');try{const b=await callFile('analyze_screenshot',file);closeModal();const x=b.extracted||{};if(x.foundTrade===false){alert('AI не нашёл сделку на скриншоте.');return}tradeModal({...x,source:'screenshot'})}catch(e){closeModal();alert(msg(e))}}
function planModal(){modal('Новый план','<div class="fields"><input id="plpair" placeholder="BTC/USDT"><select id="pldir"><option>Long</option><option>Short</option></select><input id="plentry" placeholder="Плановый вход"><input id="plstop" placeholder="Стоп"><input id="pltarget" placeholder="Цель (необязательно)"><input id="plsize" placeholder="Размер позиции"><input id="pldep" placeholder="Депозит (для риска %)"><input id="plstrategy" placeholder="Стратегия"><textarea id="plnote" placeholder="Заметка к плану"></textarea><button class="btn" onclick="savePlan()">Зафиксировать план до входа</button></div>')}
async function savePlan(){const plan={exchange:'BingX',market:'Фьючерсы',pair:$('#plpair').value.trim(),direction:$('#pldir').value,plannedEntry:$('#plentry').value.trim(),stop:$('#plstop').value.trim(),target:$('#pltarget').value.trim(),positionSize:$('#plsize').value.trim(),deposit:$('#pldep').value.trim(),riskUnit:'percent',strategy:$('#plstrategy').value.trim(),note:$('#plnote').value.trim()};try{state=await call('lock_trade_plan',{plan});closeModal();render()}catch(e){alert(msg(e))}}
async function cancelPlan(planId){if(!confirm('Отменить этот план?'))return;try{state=await call('cancel_trade_plan',{plan_id:planId});render()}catch(e){alert(msg(e))}}
async function saveProfile(){try{state=await call('save_profile',{profile:{exchange:$('#pex').value,market:$('#pmarket').value,style:$('#pstyle').value,deposit:$('#pdep').value}});render()}catch(e){alert(msg(e))}}
async function connectBingx(){if(busy)return;const api=$('#bxkey')?.value.trim(),secret=$('#bxsecret')?.value.trim();if(!api||!secret){alert('Введи API Key и Secret Key.');return}busy=true;try{const b=await call('connect_exchange',{exchange:'bingx',api_key:api,secret_key:secret});state=b;render()}catch(e){alert(msg(e))}finally{busy=false}}
async function verifyBingx(){try{state=await call('verify_exchange',{exchange:'bingx'});render()}catch(e){alert(msg(e))}}
async function syncBingx(){if(busy)return;busy=true;try{const b=await call('sync_exchange',{exchange:'bingx'});state=b;render();alert('BingX синхронизирован.')}catch(e){alert(msg(e))}finally{busy=false}}
async function disconnectBingx(){if(!confirm('Отключить BingX? Журнал сделок останется.'))return;try{state=await call('disconnect_exchange',{exchange:'bingx'});render()}catch(e){alert(msg(e))}}
async function disciplineAI(){if(busy)return;busy=true;const out=$('#aiout');if(out)out.innerHTML='<p class="green">Анализируем журнал…</p>';try{const b=await call('analyze_discipline');aiResult=b.analysis||null;patterns()}catch(e){if(out)out.innerHTML='<div class="errorbox">'+esc(msg(e))+'</div>'}finally{busy=false}}
function supportModal(){modal('Сообщить о проблеме','<div class="fields"><select id="scat"><option value="bug">Ошибка</option><option value="sync">BingX sync</option><option value="plan_fact">Plan vs Fact</option><option value="ux">Интерфейс</option><option value="other">Другое</option></select><textarea id="smsg" placeholder="Кратко опиши проблему. Не отправляй API/Secret Key."></textarea><button class="btn" onclick="sendSupport()">Отправить</button></div>')}
async function sendSupport(){try{await call('submit_support',{category:$('#scat').value,message:$('#smsg').value});closeModal();alert('Сообщение отправлено.')}catch(e){alert(msg(e))}}
async function loadAdmin(){try{const d=(await call('beta_admin_dashboard')).dashboard;$('#admin').innerHTML='<div class="muted tiny">Активных: '+d.activeCount+' / '+d.capacity+'</div>'+(d.users.length?d.users.map(u=>'<div class="user"><div class="between"><b>'+esc(u.accountCode)+'</b><span class="pill">'+esc(u.tier)+'</span></div><div class="muted tiny">Сделок '+u.tradeCount+' · Планов '+u.planCount+' · AI '+u.aiCount+'</div><div class="row"><button class="btn small" onclick="setBeta(\''+u.accountCode+'\',30)">+30</button><button class="btn small" onclick="setBeta(\''+u.accountCode+'\',90)">+90</button><button class="btn small secondary" onclick="setBetaPermanent(\''+u.accountCode+'\')">Бессрочно</button><button class="btn small danger" onclick="revokeBeta(\''+u.accountCode+'\')">Отозвать</button><button class="btn small amber" onclick="blockUser(\''+u.accountCode+'\','+(u.status==='blocked'?'false':'true')+')">'+(u.status==='blocked'?'Разблокировать':'Блокировать')+'</button></div></div>').join(''):'<div class="empty">Пользователей пока нет.</div>')+(d.feedback?.length?'<h3>Обратная связь</h3>'+d.feedback.slice(0,10).map(f=>'<div class="user"><b>'+esc(f.accountCode)+' · '+esc(f.category)+'</b><p>'+esc(f.message)+'</p></div>').join(''):'')}catch(e){alert(msg(e))}}
async function setBeta(code,days){try{await call('set_beta_access',{target_account_code:code,enabled:true,duration_days:days,permanent:false});loadAdmin()}catch(e){alert(msg(e))}}
async function setBetaPermanent(code){try{await call('set_beta_access',{target_account_code:code,enabled:true,permanent:true});loadAdmin()}catch(e){alert(msg(e))}}
async function revokeBeta(code){if(!confirm('Отозвать Beta Pro?'))return;try{await call('set_beta_access',{target_account_code:code,enabled:false,permanent:false});loadAdmin()}catch(e){alert(msg(e))}}
async function blockUser(code,blocked){if(!confirm(blocked?'Заблокировать пользователя?':'Разблокировать пользователя?'))return;try{await call('set_user_blocked',{target_account_code:code,blocked});loadAdmin()}catch(e){alert(msg(e))}}
async function deleteAccount(){if(!confirm('Удалить все мои данные PlanFact? Это действие необратимо.'))return;try{await call('delete_account_data');location.reload()}catch(e){alert(msg(e))}}
async function boot(){if(!init){gate('open');return}document.getElementById('root').innerHTML='<main class="app gate"><section class="card"><div class="pf">PF</div><h1>Проверяем доступ</h1><p class="green">Проверяем подписку и профиль…</p></section></main>';try{state=await call('account');render()}catch(e){if(e.code==='channel_subscription_required')gate('sub');else if(['telegram_auth_required','telegram_signature_invalid','telegram_session_expired'].includes(e.code))gate('open');else gate('fail')}}
boot();
</script></body></html>
